name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate Python app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall App.py Ingest.py Qwen_embeddings.py RAG.py services

      - name: Run tests
        run: python -m unittest tests.test_prompt_contract tests.test_ui_contract

      - name: Smoke test FastAPI routes
        run: |
          python - <<'PY'
          from App import app

          routes = {route.path for route in app.routes}
          assert "/" in routes
          assert "/health" in routes
          assert "/ask" in routes
          print("FastAPI routes are registered.")
          PY
