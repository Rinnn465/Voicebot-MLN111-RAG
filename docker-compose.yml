services:
  rag-api:
    build:
      context: .
    container_name: voicebot-rag-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHROMA_DIR: ${CHROMA_DIR:-/app/chroma_db}
      SENTENCE_TRANSFORMERS_HOME: ${SENTENCE_TRANSFORMERS_HOME:-/app/models/sentence_transformers}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-1}
    volumes:
      - chroma-data:/app/chroma_db
      - model-cache:/app/models
    ports:
      - "127.0.0.1:18000:8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20m

volumes:
  chroma-data:
  model-cache:
