<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voicebot MLN111</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #050812;
      --panel: rgba(10, 16, 31, 0.72);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #9aa7bb;
      --cyan: #5eead4;
      --blue: #60a5fa;
      --gold: #f5c66b;
      --rose: #fb7185;
      --green: #86efac;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 38%, rgba(94, 234, 212, 0.18), transparent 25rem),
        radial-gradient(circle at 25% 18%, rgba(96, 165, 250, 0.18), transparent 28rem),
        radial-gradient(circle at 80% 72%, rgba(245, 198, 107, 0.12), transparent 24rem),
        linear-gradient(135deg, #030712 0%, #07111f 46%, #020617 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, black 0 46%, transparent 78%);
    }

    .app-shell {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(18px, 3vw, 42px);
    }

    .top-status {
      position: fixed;
      top: 22px;
      left: 50%;
      z-index: 5;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(2, 6, 23, 0.58);
      padding: 10px 14px;
      color: #dbeafe;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.3);
    }

    .top-status i { width: 17px; height: 17px; color: var(--cyan); }

    .model-stage {
      position: relative;
      width: min(80vw, 980px);
      height: min(68vh, 720px);
      display: grid;
      place-items: center;
    }

    .model-stage::before,
    .model-stage::after {
      content: "";
      position: absolute;
      inset: 8%;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      animation: slow-spin 28s linear infinite;
    }

    .model-stage::after {
      inset: 18%;
      border-style: dashed;
      border-color: rgba(94, 234, 212, 0.2);
      animation-duration: 18s;
      animation-direction: reverse;
    }

    .model-core {
      position: relative;
      width: clamp(280px, 38vw, 560px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,0.95), transparent 0.7rem),
        radial-gradient(circle at 38% 30%, rgba(255,255,255,0.5), transparent 4.8rem),
        radial-gradient(circle at 55% 45%, rgba(94, 234, 212, 0.88), transparent 11rem),
        radial-gradient(circle at 62% 70%, rgba(96, 165, 250, 0.64), transparent 13rem),
        radial-gradient(circle at 42% 74%, rgba(245, 198, 107, 0.54), transparent 10rem),
        #07111f;
      box-shadow:
        0 0 90px rgba(94, 234, 212, 0.28),
        inset 0 0 80px rgba(255, 255, 255, 0.12),
        inset -38px -60px 90px rgba(2, 6, 23, 0.72);
      animation: idle-float 5.5s ease-in-out infinite;
      transition: filter 220ms ease, box-shadow 220ms ease, transform 220ms ease;
    }

    .model-core::before {
      content: "";
      position: absolute;
      inset: -18%;
      border-radius: inherit;
      background: conic-gradient(from 130deg, transparent, rgba(94,234,212,0.28), transparent, rgba(245,198,107,0.18), transparent);
      filter: blur(18px);
      z-index: -1;
      animation: slow-spin 12s linear infinite;
    }

    .model-face {
      position: absolute;
      inset: 30% 25% auto;
      display: flex;
      justify-content: space-between;
      opacity: 0.82;
    }

    .model-face span {
      width: clamp(18px, 3vw, 34px);
      height: clamp(18px, 3vw, 34px);
      border-radius: 50%;
      background: rgba(2, 6, 23, 0.74);
      box-shadow: 0 0 22px rgba(255,255,255,0.18);
    }

    .model-mouth {
      position: absolute;
      left: 50%;
      top: 54%;
      width: 24%;
      height: 7%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(2, 6, 23, 0.42);
      box-shadow: inset 0 0 18px rgba(255,255,255,0.14);
    }

    body[data-state="listening"] .model-core {
      box-shadow: 0 0 110px rgba(251,113,133,0.35), inset 0 0 90px rgba(255,255,255,0.14);
      filter: saturate(1.18);
    }

    body[data-state="thinking"] .model-core {
      animation: thinking-pulse 1.35s ease-in-out infinite;
      box-shadow: 0 0 120px rgba(96,165,250,0.38), inset 0 0 90px rgba(255,255,255,0.14);
    }

    body[data-state="speaking"] .model-mouth {
      animation: talk 420ms ease-in-out infinite;
      background: rgba(94, 234, 212, 0.34);
    }

    body[data-state="error"] .model-core {
      box-shadow: 0 0 110px rgba(251,113,133,0.48), inset 0 0 90px rgba(255,255,255,0.14);
    }

    .voice-widget {
      position: fixed;
      left: 50%;
      bottom: clamp(16px, 4vh, 38px);
      z-index: 10;
      width: min(760px, calc(100vw - 28px));
      transform: translateX(-50%);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(3, 7, 18, 0.68);
      box-shadow: 0 22px 90px rgba(0, 0, 0, 0.46);
      backdrop-filter: blur(22px);
      padding: 14px;
    }

    .widget-main {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: center;
    }

    .mic-button {
      width: 62px;
      height: 62px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 22px;
      display: grid;
      place-items: center;
      color: white;
      background: rgba(255,255,255,0.08);
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .mic-button:hover:not(:disabled) { transform: translateY(-2px); }
    .mic-button:disabled { cursor: wait; opacity: 0.64; }
    .mic-button.is-listening {
      border-color: rgba(251,113,133,0.78);
      background: rgba(251,113,133,0.18);
      animation: breathe 1s ease-in-out infinite;
    }

    .mic-button i { width: 25px; height: 25px; }

    .transcript-panel {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .widget-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .mic-status { color: #cbd5e1; }
    .mic-status.is-listening { color: #fecdd3; }

    .transcript-text {
      min-height: 22px;
      margin: 0;
      overflow: hidden;
      color: #e2e8f0;
      font-size: 14px;
      line-height: 1.55;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .transcript-partial {
      min-height: 20px;
      margin: 0;
      color: var(--cyan);
      font-size: 13px;
      font-style: italic;
      line-height: 1.5;
    }

    .transcript-input {
      width: 100%;
      min-height: 44px;
      max-height: 96px;
      resize: vertical;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.58);
      color: white;
      padding: 10px 12px;
      font: inherit;
      font-size: 13px;
      line-height: 1.45;
      outline: none;
    }

    .transcript-input:focus {
      border-color: rgba(94,234,212,0.5);
      box-shadow: 0 0 0 3px rgba(94,234,212,0.1);
    }

    .status-line {
      min-height: 20px;
      margin: 8px 4px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .answer-card {
      max-height: 24vh;
      margin-top: 10px;
      overflow: auto;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 10px 4px 0;
    }

    .answer-card.hidden,
    .hidden { display: none !important; }

    .answer-markdown {
      color: #edf2f7;
      font-size: 13px;
      line-height: 1.65;
    }

    .answer-markdown p { margin: 0 0 0.72rem; }
    .answer-markdown ul, .answer-markdown ol { margin: 0.55rem 0; padding-left: 1.25rem; }
    audio { width: 100%; margin-top: 8px; }

    @keyframes idle-float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-18px) scale(1.015); }
    }

    @keyframes thinking-pulse {
      0%, 100% { transform: translateY(-4px) scale(1); filter: saturate(1); }
      50% { transform: translateY(-14px) scale(1.04); filter: saturate(1.24); }
    }

    @keyframes slow-spin { to { transform: rotate(360deg); } }

    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 0 0 rgba(251,113,133,0.22); }
      50% { box-shadow: 0 0 0 12px rgba(251,113,133,0); }
    }

    @keyframes talk {
      0%, 100% { height: 6%; transform: translateX(-50%) scaleX(0.82); }
      50% { height: 13%; transform: translateX(-50%) scaleX(1.12); }
    }

    @media (max-width: 720px) {
      body { overflow-y: auto; }
      .app-shell { min-height: 100svh; padding-bottom: 230px; }
      .model-stage { width: 100%; height: 62vh; }
      .widget-main { grid-template-columns: 1fr; }
      .mic-button { width: 100%; height: 56px; border-radius: 18px; }
      .transcript-text { white-space: normal; }
    }
  </style>
</head>

<body data-state="idle">
  <main class="app-shell" aria-labelledby="appTitle">
    <div class="top-status" aria-live="polite">
      <i id="stateIcon" data-lucide="sparkles" aria-hidden="true"></i>
      <span id="stateLabel">Idle</span>
    </div>

    <section id="modelRenderer" class="model-stage" aria-label="AI model renderer">
      <h1 id="appTitle" class="hidden">Voicebot MLN111</h1>
      <div class="model-core" aria-hidden="true">
        <div class="model-face"><span></span><span></span></div>
        <div class="model-mouth"></div>
      </div>
    </section>

    <section id="voiceWidget" class="voice-widget" aria-label="Voice chat widget">
      <div class="widget-main">
        <button
          id="micBtn"
          class="mic-button"
          type="button"
          title="Bật hoặc tắt mic"
          aria-label="Bật mic để nói với AI"
          aria-pressed="false"
        >
          <i data-lucide="mic" aria-hidden="true"></i>
        </button>

        <div class="transcript-panel">
          <div class="widget-label-row">
            <span>Voice chat</span>
            <span id="micStatus" class="mic-status">Mic sẵn sàng</span>
          </div>
          <p id="transcriptFinal" class="transcript-text">Nhấn mic để nói. Tắt mic sẽ tự gửi câu hỏi và phát câu trả lời.</p>
          <p id="transcriptPartial" class="transcript-partial"></p>
          <textarea
            id="question"
            class="transcript-input"
            rows="2"
            placeholder="Transcript sẽ xuất hiện ở đây..."
            aria-label="Transcript hoặc câu hỏi"
          ></textarea>
        </div>
      </div>

      <div id="status" class="status-line" aria-live="polite"></div>

      <section id="result" class="answer-card hidden" aria-label="Câu trả lời AI">
        <div id="answer" class="answer-markdown"></div>
        <audio id="answerAudio" class="hidden" controls></audio>
      </section>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
