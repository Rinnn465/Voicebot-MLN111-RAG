<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLN111 Voice Avatar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/lucide@latest"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3/lib/three-vrm-animation.module.min.js"
      }
    }
  </script>

  <style>
    :root {
      --bg: #0a0d12;
      --panel: rgba(17, 24, 39, 0.72);
      --panel-strong: rgba(5, 10, 19, 0.86);
      --line: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #9aa7b8;
      --accent: #78d7c4;
      --warm: #f2c166;
      --danger: #f07178;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(145deg, rgba(120, 215, 196, 0.14), transparent 34%),
        linear-gradient(315deg, rgba(242, 193, 102, 0.13), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .app-shell {
      width: min(1180px, calc(100% - 28px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px 0;
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(330px, 0.82fr);
      gap: 18px;
    }

    .avatar-stage,
    .voice-panel {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.38);
      border-radius: 8px;
    }

    .avatar-stage {
      position: relative;
      min-height: calc(100vh - 44px);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .avatar-topbar,
    .avatar-bottombar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #061015;
      background: var(--accent);
      font-weight: 800;
    }

    .brand h1,
    .panel-title h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .brand p,
    .avatar-hint,
    .status-line,
    .transcript-label,
    .transcript-text,
    .partial-text {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .state-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      border: 1px solid rgba(120, 215, 196, 0.35);
      border-radius: 999px;
      padding: 0 13px;
      background: rgba(120, 215, 196, 0.1);
      color: #ccfff4;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .state-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 7px rgba(120, 215, 196, 0.12);
    }

    .avatar-canvas-wrap {
      position: relative;
      min-height: 520px;
    }

    #avatarCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .avatar-loading {
      position: absolute;
      inset: auto 20px 20px auto;
      z-index: 3;
      color: #d7dee8;
      font-size: 13px;
      opacity: 0.9;
    }

    .avatar-bottombar {
      align-items: flex-end;
      background: linear-gradient(to top, rgba(5, 10, 19, 0.88), transparent);
    }

    .wave {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 44px;
    }

    .wave span {
      width: 5px;
      height: 16px;
      border-radius: 999px;
      background: rgba(120, 215, 196, 0.78);
      transform-origin: center;
    }

    body[data-avatar-state="listening"] .wave span,
    body[data-avatar-state="speaking"] .wave span {
      animation: wave 820ms ease-in-out infinite;
    }

    .wave span:nth-child(2) { height: 29px; animation-delay: 90ms; }
    .wave span:nth-child(3) { height: 38px; animation-delay: 180ms; }
    .wave span:nth-child(4) { height: 25px; animation-delay: 270ms; }
    .wave span:nth-child(5) { height: 18px; animation-delay: 360ms; }

    .voice-panel {
      min-height: calc(100vh - 44px);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .icon-badge {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: rgba(120, 215, 196, 0.1);
      border: 1px solid rgba(120, 215, 196, 0.25);
    }

    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .tool-btn,
    .ghost-btn {
      min-height: 52px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 14px;
      font-weight: 800;
      color: var(--text);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .tool-btn:hover:not(:disabled),
    .ghost-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.1);
    }

    .record-btn {
      color: #071014;
      background: var(--accent);
      border-color: rgba(120, 215, 196, 0.8);
    }

    .record-btn.is-listening {
      color: white;
      background: rgba(240, 113, 120, 0.18);
      border-color: rgba(240, 113, 120, 0.55);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #d9e2ef;
      font-size: 13px;
      line-height: 1.5;
    }

    .transcript-card {
      flex: 1;
      min-height: 260px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transcript-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .transcript-text {
      color: #edf4fb;
      font-size: 18px;
      line-height: 1.75;
    }

    .partial-text {
      min-height: 24px;
      color: #78d7c4;
      font-style: italic;
    }

    #answerAudio {
      width: 100%;
      margin-top: 4px;
    }

    .hidden {
      display: none !important;
    }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.45); opacity: 0.55; }
      50% { transform: scaleY(1.12); opacity: 1; }
    }

    @media (max-width: 920px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .avatar-stage,
      .voice-panel {
        min-height: auto;
      }

      .avatar-canvas-wrap {
        min-height: 62vh;
      }
    }

    @media (max-width: 560px) {
      .app-shell {
        width: min(100% - 18px, 1180px);
        padding: 9px 0;
      }

      .avatar-topbar,
      .avatar-bottombar,
      .voice-panel {
        padding: 13px;
      }

      .control-grid {
        grid-template-columns: 1fr;
      }

      .brand h1,
      .panel-title h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body data-avatar-state="idle">
  <main class="app-shell">
    <section class="avatar-stage" aria-labelledby="appTitle">
      <header class="avatar-topbar">
        <div class="brand">
          <div class="brand-mark">ML</div>
          <div>
            <h1 id="appTitle">MLN111 Voice Avatar</h1>
            <p>Hỏi đáp chương 2 bằng giọng nói</p>
          </div>
        </div>
        <div class="state-pill" aria-live="polite">
          <span class="state-dot"></span>
          <span id="avatarStateText">Idle</span>
        </div>
      </header>

      <div id="avatarContainer" class="avatar-canvas-wrap">
        <canvas id="avatarCanvas"></canvas>
        <div id="avatarLoading" class="avatar-loading">Đang tải avatar VRM...</div>
      </div>

      <footer class="avatar-bottombar">
        <p class="avatar-hint" id="micStatus">Mic sẵn sàng</p>
        <div id="waveform" class="wave" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </footer>
    </section>

    <aside class="voice-panel" aria-labelledby="voicePanelTitle">
      <div class="panel-title">
        <h2 id="voicePanelTitle">Điều khiển giọng nói</h2>
        <div class="icon-badge"><i data-lucide="audio-lines" aria-hidden="true"></i></div>
      </div>

      <div class="control-grid">
        <button id="recordBtn" class="tool-btn record-btn" type="button">
          <i data-lucide="mic" aria-hidden="true"></i>
          Ghi âm
        </button>
        <button id="stopBtn" class="tool-btn" type="button" disabled>
          <i data-lucide="square" aria-hidden="true"></i>
          Dừng
        </button>
      </div>

      <button id="clearBtn" type="button" class="ghost-btn">
        <i data-lucide="rotate-ccw" aria-hidden="true"></i>
        Xóa hội thoại
      </button>

      <label class="toggle-row">
        <input id="speakAnswerToggle" type="checkbox" checked />
        Đọc câu trả lời bằng ElevenLabs
      </label>

      <section class="transcript-card" aria-labelledby="transcriptTitle">
        <p id="transcriptTitle" class="transcript-label">Transcript</p>
        <p id="transcriptFinal" class="transcript-text">Chưa có transcript.</p>
        <p id="transcriptPartial" class="partial-text"></p>
      </section>

      <div id="audioSlot"></div>
      <div id="status" class="status-line" aria-live="polite"></div>
    </aside>
  </main>

  <script type="module" src="/static/avatar.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
